# verification_weights.yaml
# Configurable weights for the 4 validation components of the weather narrative pipeline
# Total sum does not need to equal 1.0 (will be normalized by harmonic mean calculation)

weights:
  data_fact: 0.35        # Weight for DataFactValidator score
  met_rule: 0.25         # Weight for MeteorologicalRuleEngine score
  causal_graph: 0.20     # Weight for CausalGraph validity score
  temporal_consistency: 0.20 # Weight for TemporalConsistencyChecker score
