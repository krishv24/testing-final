# met_rules.yaml
# Meteorological rules database for weather verification

rules:
  - rule_id: "RULE_001"
    name: "Baric Wind Rule"
    description: "A rapid pressure drop indicates a strengthening pressure gradient, which is highly likely to cause an increase in wind speed."
    antecedent:
      variable: "pressure_change_6h"
      condition: "less_than_or_equal"
      threshold: -3.0
    consequent:
      variable: "wind_speed"
      condition: "greater_than_or_equal"
      threshold: 8.0
    confidence_weight: 0.75
    expected_lag_hours: 3.0

  - rule_id: "RULE_002"
    name: "Saturated Air Precipitation Likelihood"
    description: "When relative humidity is extremely high (saturated air mass), precipitation is highly probable."
    antecedent:
      variable: "relative_humidity"
      condition: "greater_than"
      threshold: 90.0
    consequent:
      variable: "precipitation"
      condition: "greater_than"
      threshold: 0.0
    confidence_weight: 0.85
    expected_lag_hours: 0.0

  - rule_id: "RULE_003"
    name: "Thermal Low Development"
    description: "Extremely high surface temperatures can lead to localized thermal low-pressure development as warm air rises."
    antecedent:
      variable: "temperature"
      condition: "greater_than"
      threshold: 35.0
    consequent:
      variable: "pressure_change_6h"
      condition: "less_than"
      threshold: -1.5
    confidence_weight: 0.60
    expected_lag_hours: 2.0

  - rule_id: "RULE_004"
    name: "Convective Instability Storm Risk"
    description: "If the weather category indicates thunderstorm conditions with high moisture, expect heavy precipitation."
    antecedent:
      variable: "weather_category"
      condition: "equals"
      threshold: "thunderstorm"
    consequent:
      variable: "precipitation"
      condition: "greater_than_or_equal"
      threshold: 7.6
    confidence_weight: 0.80
    expected_lag_hours: 0.0

  - rule_id: "RULE_005"
    name: "Cold Frontal Passage"
    description: "A sudden significant temperature drop is characteristically associated with a post-frontal pressure rise."
    antecedent:
      variable: "temperature_change_3h"
      condition: "less_than"
      threshold: -3.0
    consequent:
      variable: "pressure_change_3h"
      condition: "greater_than"
      threshold: 1.5
    confidence_weight: 0.80
    expected_lag_hours: 1.0

  - rule_id: "RULE_006"
    name: "Onshore Sea Breeze Initiation"
    description: "Warm afternoon temperatures trigger a sea breeze circulation, shifting and increasing wind speed."
    antecedent:
      variable: "temperature"
      condition: "greater_than"
      threshold: 28.0
    consequent:
      variable: "wind_speed"
      condition: "greater_than"
      threshold: 4.0
    confidence_weight: 0.70
    expected_lag_hours: 1.0

  - rule_id: "RULE_007"
    name: "Cyclone Severe Wind Risk"
    description: "An extreme drop in pressure over 6 hours indicates a deep low-pressure system, which strongly predicts severe winds."
    antecedent:
      variable: "pressure_change_6h"
      condition: "less_than_or_equal"
      threshold: -6.0
    consequent:
      variable: "wind_speed"
      condition: "greater_than_or_equal"
      threshold: 17.2
    confidence_weight: 0.85
    expected_lag_hours: 2.0

  - rule_id: "RULE_008"
    name: "Dry Air Rain Suppression"
    description: "When the air column is dry, any falling precipitation will likely evaporate before hitting the ground."
    antecedent:
      variable: "relative_humidity"
      condition: "less_than"
      threshold: 30.0
    consequent:
      variable: "precipitation"
      condition: "equal"
      threshold: 0.0
    confidence_weight: 0.95
    expected_lag_hours: 0.0

  - rule_id: "RULE_009"
    name: "Warm Frontal Advection"
    description: "A steady rise in temperature from warm advection is typically coupled with a drop in surface pressure."
    antecedent:
      variable: "temperature_change_6h"
      condition: "greater_than"
      threshold: 3.0
    consequent:
      variable: "pressure_change_6h"
      condition: "less_than"
      threshold: -1.5
    confidence_weight: 0.70
    expected_lag_hours: 2.0

  - rule_id: "RULE_010"
    name: "Diurnal Radiational Cooling"
    description: "Dry atmospheric conditions overnight trigger radiational cooling, leading to a marked temperature drop."
    antecedent:
      variable: "relative_humidity"
      condition: "less_than"
      threshold: 40.0
    consequent:
      variable: "temperature_change_6h"
      condition: "less_than"
      threshold: -4.0
    confidence_weight: 0.70
    expected_lag_hours: 6.0

  - rule_id: "RULE_011"
    name: "Radiation Fog Formation"
    description: "Near-saturated relative humidity under calm winds leads to radiation fog, severely restricting visibility."
    antecedent:
      variable: "relative_humidity"
      condition: "greater_than_or_equal"
      threshold: 98.0
    consequent:
      variable: "visibility"
      condition: "less_than"
      threshold: 1000.0
    confidence_weight: 0.75
    expected_lag_hours: 2.0

  - rule_id: "RULE_012"
    name: "Rainfall Saturation Effect"
    description: "Moderate to heavy rain processes will saturate the near-surface air, driving relative humidity up."
    antecedent:
      variable: "precipitation"
      condition: "greater_than"
      threshold: 2.5
    consequent:
      variable: "relative_humidity"
      condition: "greater_than"
      threshold: 85.0
    confidence_weight: 0.90
    expected_lag_hours: 1.0

  - rule_id: "RULE_013"
    name: "Evaporative Cooling Drop"
    description: "The onset of steady rain cools the surrounding air via evaporation, causing temperature to drop."
    antecedent:
      variable: "precipitation"
      condition: "greater_than"
      threshold: 5.0
    consequent:
      variable: "temperature_change_3h"
      condition: "less_than"
      threshold: -2.0
    confidence_weight: 0.65
    expected_lag_hours: 1.0

  - rule_id: "RULE_014"
    name: "Heavy Rain Wind Gusts"
    description: "Heavy rain indicates convective activity, which is highly correlated with sudden wind gusts from downdrafts."
    antecedent:
      variable: "precipitation"
      condition: "greater_than"
      threshold: 10.0
    consequent:
      variable: "wind_gust"
      condition: "greater_than_or_equal"
      threshold: 15.0
    confidence_weight: 0.75
    expected_lag_hours: 0.5

  - rule_id: "RULE_015"
    name: "High Pressure Wind Suppression"
    description: "Centered under strong high pressure, descending air suppresses gradient forces, causing calm or light winds."
    antecedent:
      variable: "pressure"
      condition: "greater_than"
      threshold: 1025.0
    consequent:
      variable: "wind_speed"
      condition: "less_than_or_equal"
      threshold: 3.4
    confidence_weight: 0.80
    expected_lag_hours: 0.0
