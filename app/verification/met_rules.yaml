# ==============================================================================
# met_rules.yaml - Official WMO Meteorological Verification Rules Database
# Grounded strictly in WMO-No. 8, WMO-No. 306, WMO-No. 488, and WMO-No. 558 standards.
#
# Rule Hierarchy:
#   - Tier 1: Physical Invariants & Thermodynamic Laws (Fatal violation if broken)
#   - Tier 2: Cross-Variable Consistency & WMO Present Weather Definitions (Major inconsistency)
#   - Tier 3: Dynamic Synoptic Tendencies & Atmospheric Physics (Advisory / Contradiction check)
# ==============================================================================

rules:
  # ============================================================================
  # TIER 1: PHYSICAL INVARIANTS & THERMODYNAMIC LAWS (WMO-No. 8, Part I)
  # Absolute laws of physics and kinematics that can NEVER be violated in nature.
  # ============================================================================

  - rule_id: "WMO_PHYS_001"
    name: "WMO Dew Point Depression Non-Negativity"
    tier: 1
    wmo_reference: "WMO-No. 8, Vol I, Chapter 4 (Humidity), §4.1.2 & §4.3"
    severity: "critical"
    description: "Thermodynamic saturation law: ambient dry-bulb temperature represents the absolute thermodynamic ceiling for dew point temperature. Dew point depression (T - Td) must be >= 0."
    antecedent:
      variable: "temperature"
      condition: "greater_than_or_equal"
      threshold: -80.0
    consequent:
      variable: "dew_point"
      condition: "less_than_or_equal_variable"
      target_variable: "temperature"
    confidence_weight: 1.00
    expected_lag_hours: 0.0

  - rule_id: "WMO_PHYS_002"
    name: "WMO Kinematic Gust Floor Law"
    tier: 1
    wmo_reference: "WMO-No. 8, Vol I, Chapter 5 (Surface Wind), §5.1.3 & §5.8"
    severity: "critical"
    description: "Kinematic peak law: an instantaneous wind gust (3-second moving maximum) must be greater than or equal to the sustained 10-minute mean wind speed (V_gust >= V_mean)."
    antecedent:
      variable: "wind_speed"
      condition: "greater_than"
      threshold: 0.0
    consequent:
      variable: "wind_gust"
      condition: "greater_than_or_equal_variable"
      target_variable: "wind_speed"
    confidence_weight: 1.00
    expected_lag_hours: 0.0

  - rule_id: "WMO_PHYS_003"
    name: "WMO Relative Humidity Thermodynamic Range"
    tier: 1
    wmo_reference: "WMO-No. 8, Vol I, Chapter 4, Table 1.A & Annex 1.A"
    severity: "critical"
    description: "By thermodynamic definition, surface relative humidity with respect to water must remain bounded between 0% (absolute drought) and 100% (saturation)."
    antecedent:
      variable: "relative_humidity"
      condition: "exists"
    consequent:
      variable: "relative_humidity"
      condition: "between"
      threshold: [0.0, 100.0]
    confidence_weight: 1.00
    expected_lag_hours: 0.0

  - rule_id: "WMO_PHYS_004"
    name: "WMO Precipitation Physical Floor"
    tier: 1
    wmo_reference: "WMO-No. 8, Vol I, Chapter 6 (Precipitation), §6.1"
    severity: "critical"
    description: "Precipitation accumulation and precipitation rate are strictly non-negative physical quantities (>= 0.0 mm)."
    antecedent:
      variable: "precipitation"
      condition: "exists"
    consequent:
      variable: "precipitation"
      condition: "greater_than_or_equal"
      threshold: 0.0
    confidence_weight: 1.00
    expected_lag_hours: 0.0

  - rule_id: "WMO_PHYS_005"
    name: "WMO Climatological MSLP Plausibility Range"
    tier: 1
    wmo_reference: "WMO-No. 8, Vol I, Chapter 3 (Atmospheric Pressure), Table 1.A"
    severity: "critical"
    description: "Global climatological surface pressure limits: mean sea level pressure must stay within physical planetary bounds (870.0 hPa in extreme tropical cyclones to 1085.0 hPa in Siberian winter anticyclones)."
    antecedent:
      variable: "pressure"
      condition: "exists"
    consequent:
      variable: "pressure"
      condition: "between"
      threshold: [870.0, 1085.0]
    confidence_weight: 1.00
    expected_lag_hours: 0.0

  # ============================================================================
  # TIER 2: CROSS-VARIABLE CONSISTENCY & WMO DEFINITIONS (WMO-No. 8 & WMO-No. 306)
  # Observational definitions and mutual exclusivity across simultaneous variables.
  # ============================================================================

  - rule_id: "WMO_XVAR_001"
    name: "WMO Fog Classification Standard (FG)"
    tier: 2
    wmo_reference: "WMO-No. 8, Vol I, Chapter 9 (Visibility), §9.1 & WMO-No. 306 Code Table 4678 (FG)"
    severity: "major"
    wmo_code: "FG"
    description: "Official WMO definition: Fog requires horizontal visibility strictly under 1000 m (MOR < 1 km) accompanied by high relative humidity (>= 90%) due to suspended water droplets."
    antecedent:
      variable: "weather_category"
      condition: "equals"
      threshold: "fog"
    consequent:
      variable: "visibility"
      condition: "less_than"
      threshold: 1000.0
    confidence_weight: 0.95
    expected_lag_hours: 0.0

  - rule_id: "WMO_XVAR_002"
    name: "WMO Mist Classification Standard (BR)"
    tier: 2
    wmo_reference: "WMO-No. 8, Vol I, Chapter 9, §9.1 & WMO-No. 306 Code Table 4678 (BR)"
    severity: "major"
    wmo_code: "BR"
    description: "Official WMO definition: Mist is defined as visibility restricted between 1000 m and 5000 m by microscopic water droplets with relative humidity not less than 80%."
    antecedent:
      variable: "weather_category"
      condition: "equals"
      threshold: "mist"
    consequent:
      variable: "visibility"
      condition: "between"
      threshold: [1000.0, 5000.0]
    confidence_weight: 0.90
    expected_lag_hours: 0.0

  - rule_id: "WMO_XVAR_003"
    name: "WMO Liquid Precipitation Saturation Limit"
    tier: 2
    wmo_reference: "WMO-No. 8, Vol I, Chapter 6 & WMO-No. 488 (GDPS QC), §6.3"
    severity: "major"
    wmo_code: "RA"
    description: "Significant surface rainfall (>= 2.5 mm) is physically incompatible with a hyper-dry boundary layer (RH < 30%), as raindrops evaporate rapidly before reaching the ground (virga)."
    antecedent:
      variable: "precipitation"
      condition: "greater_than_or_equal"
      threshold: 2.5
    consequent:
      variable: "relative_humidity"
      condition: "greater_than_or_equal"
      threshold: 40.0
    confidence_weight: 0.95
    expected_lag_hours: 0.0

  - rule_id: "WMO_XVAR_004"
    name: "WMO Solid Precipitation Thermal Boundary (SN)"
    tier: 2
    wmo_reference: "WMO-No. 8, Vol I, Chapter 6 & WMO-No. 306 Code Table 4678 (SN)"
    severity: "major"
    wmo_code: "SN"
    description: "Physical phase state: snow or solid precipitation requires near-surface wet-bulb temperature <= +2.5°C and surface ambient air temperature <= +3.0°C to prevent complete melting into rain."
    antecedent:
      variable: "weather_category"
      condition: "equals"
      threshold: "snow"
    consequent:
      variable: "temperature"
      condition: "less_than_or_equal"
      threshold: 3.0
    confidence_weight: 0.95
    expected_lag_hours: 0.0

  - rule_id: "WMO_XVAR_005"
    name: "WMO Thunderstorm Convective Dynamic Criteria (TS)"
    tier: 2
    wmo_reference: "WMO-No. 8, Vol I, Chapter 14 & WMO-No. 306 Code Table 4678 (TS)"
    severity: "major"
    wmo_code: "TS"
    description: "Severe convective storm dynamics: thunderstorm conditions require presence of active cumulonimbus convective activity, correlated with precipitation downdrafts or wind gusts >= 12.0 m/s."
    antecedent:
      variable: "weather_category"
      condition: "equals"
      threshold: "thunderstorm"
    consequent:
      variable: "wind_gust"
      condition: "greater_than_or_equal"
      threshold: 12.0
    confidence_weight: 0.85
    expected_lag_hours: 0.0

  - rule_id: "WMO_XVAR_006"
    name: "WMO Dry Lithometeor Haze Ceiling (HZ)"
    tier: 2
    wmo_reference: "WMO-No. 8, Vol I, Chapter 9 & WMO-No. 306 Code Table 4678 (HZ)"
    severity: "major"
    wmo_code: "HZ"
    description: "Official WMO definition: Haze consists of extremely small dry atmospheric particles (dust/smoke/pollution); relative humidity must strictly remain below 80% to distinguish from mist or fog."
    antecedent:
      variable: "weather_category"
      condition: "equals"
      threshold: "haze"
    consequent:
      variable: "relative_humidity"
      condition: "less_than"
      threshold: 80.0
    confidence_weight: 0.85
    expected_lag_hours: 0.0

  # ============================================================================
  # TIER 3: DYNAMIC SYNOPTIC TENDENCIES & TIME-LAG RELATIONS (WMO-No. 558 & 488)
  # Predictive cause-and-effect atmospheric flows. Penalized only upon contradiction.
  # ============================================================================

  - rule_id: "WMO_DYN_001"
    name: "WMO Baric Gradient Wind Law (Force 5+)"
    tier: 3
    wmo_reference: "WMO-No. 558 (Marine Meteorology) & WMO-No. 9 (Weather Reporting)"
    severity: "advisory"
    description: "Baric wind relationship: a rapid 6-hour barometric pressure drop (<= -3.0 hPa) indicates a steepening synoptic horizontal pressure gradient, generating sustained wind speeds >= 8.0 m/s (Beaufort Force 5+)."
    antecedent:
      variable: "pressure_change_6h"
      condition: "less_than_or_equal"
      threshold: -3.0
    consequent:
      variable: "wind_speed"
      condition: "greater_than_or_equal"
      threshold: 8.0
    confidence_weight: 0.75
    expected_lag_hours: 3.0

